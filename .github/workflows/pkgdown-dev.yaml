# Development docs workflow
#
# Deployment strategy:
#   - Builds pkgdown site from the `main` branch (development version)
#   - Deploys built docs into gh-pages/dev (i.e. the site root /dev/)
#   - `clean: false` ensures stable docs at the root are never deleted
#   - Does NOT deploy on pull_request events (build-only for validation)
#
# Companion workflow: pkgdown-release.yaml handles stable docs at the root.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

name: pkgdown-dev

permissions: read-all

jobs:
  pkgdown-dev:
    runs-on: ubuntu-latest
    concurrency:
      group: pkgdown-dev-${{ github.event_name != 'pull_request' || github.run_id }}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, local::.
          needs: website

      - name: Build site
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
        shell: Rscript {0}

      # Stage docs into deploy/dev so only the /dev sub-path is updated
      - name: Stage dev docs
        run: |
          mkdir -p deploy/dev
          cp -r docs/. deploy/dev/

      - name: Deploy dev docs to gh-pages /dev 🚀
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4.5.0
        with:
          clean: false
          branch: gh-pages
          folder: deploy
