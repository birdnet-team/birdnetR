# Development docs workflow
#
# Deployment strategy:
#   - Builds the pkgdown site from `main`, or from the PR on pull requests
#   - Deploys only from `main`. `development: mode: auto` puts a .9000
#     version under docs/dev (site /dev/) and a release version under docs/
#     (site root)
#   - `clean: false` keeps whatever this build does not overwrite
#   - Pull requests build the site as a check but do not deploy it
#
# Companion workflow: pkgdown-release.yaml handles stable docs at the root.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

name: pkgdown-dev

permissions: read-all

jobs:
  pkgdown-dev:
    runs-on: ubuntu-latest
    concurrency:
      group: pkgdown-dev-${{ github.event_name != 'pull_request' || github.run_id }}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, local::.
          needs: website

      - name: Build site
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
        shell: Rscript {0}

      - name: Deploy docs to gh-pages 🚀
        if: github.ref == 'refs/heads/main'
        uses: JamesIves/github-pages-deploy-action@v4.5.0
        with:
          clean: false
          branch: gh-pages
          folder: docs
